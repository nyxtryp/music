<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYXTRYP — Media Control</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070a0e;color:#e8f6ff;font:14px system-ui,sans-serif}.panel{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #17303d;padding-bottom:18px}.brand{display:flex;gap:14px;align-items:center}.mark{font-size:22px;font-weight:900;letter-spacing:.16em}.k{font-size:9px;letter-spacing:.2em;color:#6d9bb4}.title{margin:3px 0;font-size:20px;letter-spacing:.08em}.sub{color:#66808e;font-size:9px;letter-spacing:.15em}.btn{border:1px solid #24404d;background:#0b1116;color:#dff4ff;border-radius:7px;padding:9px 12px;font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer}.danger{color:#ff9a9a;border-color:#4d2529}.hero{display:flex;justify-content:space-between;align-items:end;padding:28px 0 18px}.hero h2{margin:4px 0;font-size:28px}.hero h2 span{color:#77d6ff}.total{text-align:right}.total b{display:block;font-size:28px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{border:1px solid #172b35;background:#0a0f13;color:#66808e;padding:13px;border-radius:7px;text-align:left;cursor:pointer}.tab.active{color:#e8f8ff;border-color:#38677c;background:#0d1b22}.tab b{float:right}.toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:12px 0}.search{display:flex;align-items:center;border:1px solid #172b35;background:#0a0f13;border-radius:7px;padding-left:10px}.search input{width:100%;background:none;border:0;outline:0;color:#fff;padding:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-height:calc(100vh - 300px);overflow:auto;padding:2px}.card{border:1px solid #152b35;background:#0a0f13;border-radius:8px;padding:10px}.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:#05080b;cursor:pointer}.audio{height:92px;display:grid;place-items:center;font-size:34px;color:#77d6ff;background:#0c171d;border-radius:6px}.name{margin:9px 2px 5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:8px;color:#617b89;letter-spacing:.1em}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.actions .btn{padding:7px 8px;font-size:8px}.empty{text-align:center;padding:60px;color:#4f6875;letter-spacing:.16em}.login{width:min(390px,calc(100% - 30px));margin:18vh auto;padding:28px;border:1px solid #17303d;background:#0a0f13;border-radius:10px}.login h1{margin:8px 0 2px}.login input,.modal input{width:100%;padding:12px;background:#070b0f;border:1px solid #1b3541;border-radius:7px;color:#fff;outline:0}.login .btn{width:100%;margin-top:9px}.msg{font-size:10px;margin-top:10px}.err{color:#ff8f8f}.modalbg{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:10}.preview{max-width:94vw;max-height:90vh;border-radius:8px}.progress{margin:12px 0;padding:12px;border:1px solid #24404d;background:#0b171d;border-radius:8px}.bar{height:4px;background:#132831;border-radius:4px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;width:0;background:#77d6ff}@media(max-width:700px){.panel{padding:16px 12px}.hero h2{font-size:20px}.tabs{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr auto}.search{grid-column:1/-1;grid-row:2}.grid{grid-template-columns:1fr;max-height:calc(100vh - 330px)}}
</style></head><body><div id="app"></div><script>
const TYPES={tracks:{label:'TRACKS',icon:'♪',accept:'audio/*'},radio:{label:'RADIO',icon:'◉',accept:'audio/*'},mixes:{label:'MIXES',icon:'◒',accept:'audio/*'},photos:{label:'PHOTOS',icon:'▧',accept:'image/*'}};let key=sessionStorage.getItem('nyxtryp-admin-key')||'',active='tracks',files={tracks:[],radio:[],mixes:[],photos:[]},query='';const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(method,body={}){const r=await fetch('/api/admin',{method,cache:'no-store',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:method==='GET'?undefined:JSON.stringify({...body,adminKey:key})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка '+r.status);return d}async function load(){const r=await fetch('/api/admin',{cache:'no-store',headers:{'X-Admin-Key':key}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Неверный admin key');files=d;render()}function showLogin(err=''){document.querySelector('#app').innerHTML='<form class="login" onsubmit="event.preventDefault();login()"><div class="mark">NYX</div><div class="k">NYXTRYP / PRIVATE</div><h1>MEDIA CONTROL</h1><div class="sub">ADMIN ACCESS</div><input id="loginKey" type="password" placeholder="Admin key" autofocus><button class="btn">ENTER</button>'+(err?'<div class="msg err">'+esc(err)+'</div>':'')+'</form>'}async function login(){const v=$('#loginKey').value.trim();if(!v)return;key=v;try{await api('POST',{action:'auth'});sessionStorage.setItem('nyxtryp-admin-key',key);await load()}catch(e){key='';sessionStorage.removeItem('nyxtryp-admin-key');showLogin(e.message)}}function render(){const total=Object.values(files).reduce((n,a)=>n+a.length,0),list=(files[active]||[]).filter(n=>n.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));document.querySelector('#app').innerHTML='<main class="panel"><header class="top"><div class="brand"><div class="mark">NYX</div><div><div class="k">NYXTRYP / PRIVATE</div><div class="title">MEDIA CONTROL</div><div class="sub">CONTENT MANAGEMENT</div></div></div><button class="btn" onclick="logout()">EXIT ↗</button></header><section class="hero"><div><div class="k">MEDIA LIBRARY</div><h2>YOUR UNIVERSE, <span>ORGANIZED.</span></h2></div><div class="total"><b>'+total+'</b><div class="k">TOTAL FILES</div></div></section><nav class="tabs">'+Object.entries(TYPES).map(([id,t])=>'<button class="tab '+(active===id?'active':'')+'" onclick="setActive(\''+id+'\')">'+t.icon+' &nbsp; '+t.label+' <b>'+files[id].length+'</b></button>').join('')+'</nav><section class="toolbar"><button class="btn" onclick="choose()">＋ '+(active==='photos'?'UPLOAD PHOTOS':'ADD '+TYPES[active].label.slice(0,-1))+'</button><div class="search">⌕<input value="'+esc(query)+'" oninput="query=this.value;render()" placeholder="SEARCH…"></div><button class="btn" onclick="load()">↻</button></section><input id="file" type="file" accept="'+TYPES[active].accept+'" '+(active==='photos'?'multiple':'')+' hidden onchange="upload(this.files)"><div id="progress"></div><section class="grid">'+list.map(n=>'<article class="card">'+(active==='photos'?'<img class="thumb" src="/media/photos/'+encodeURIComponent(n)+'" onclick="preview(this.src)"><div class="name">'+esc(n)+'</div>':'<div class="audio">'+TYPES[active].icon+'</div><div class="name">'+esc(n)+'</div>')+'<div class="meta">'+esc((n.split('.').pop()||'FILE').toUpperCase())+' · '+list.length+' TOTAL</div><div class="actions"><button class="btn" onclick="renameFile('+JSON.stringify(n)+')">RENAME</button><button class="btn danger" onclick="deleteFile('+JSON.stringify(n)+')">DELETE</button>'+(active!=='photos'?'<button class="btn" onclick="replaceFile('+JSON.stringify(n)+')">REPLACE</button>':'')+'</div></article>').join('')+'</section>'+(list.length?'':'<div class="empty">NO FILES FOUND</div>')+'</main>'}function setActive(id){active=id;query='';render()}function choose(replace=''){window.replaceName=replace;$('#file').value='';$('#file').click()}function replaceFile(n){choose(n)}async function upload(fs){if(!fs?.length)return;for(let i=0;i<fs.length;i++){const f=fs[i],n=window.replaceName||f.name;$('#progress').innerHTML='<div class="progress"><b>UPLOAD '+(i+1)+'/'+fs.length+' · '+esc(n)+'</b><div class="bar"><i id="bar"></i></div></div>';try{await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST','/api/upload?type='+encodeURIComponent(active)+'&name='+encodeURIComponent(n));x.setRequestHeader('X-Admin-Key',key);x.setRequestHeader('Content-Type',f.type||'application/octet-stream');x.upload.onprogress=e=>{if(e.lengthComputable)$('#bar').style.width=Math.round(e.loaded/e.total*100)+'%'};x.onload=()=>{if(x.status>=200&&x.status<300)resolve();else{let d={};try{d=JSON.parse(x.responseText)}catch{}reject(Error(d.error||'Ошибка '+x.status))}};x.onerror=()=>reject(Error('Ошибка соединения'));x.send(f)});}catch(e){alert(e.message);break}}window.replaceName='';await load()}async function deleteFile(n){if(!confirm('Удалить файл?\n\n'+n))return;try{await api('DELETE',{type:active,name:n});await load()}catch(e){alert(e.message)}}async function renameFile(n){const b=n.replace(/\.[^.]+$/,'');const v=prompt('Новое имя:',b);if(!v||v.trim()===b)return;const ext=(n.match(/\.[^.]+$/)||[''])[0];try{await api('PATCH',{type:active,oldName:n,newName:v.trim()+ext});await load()}catch(e){alert(e.message)}}function preview(src){document.body.insertAdjacentHTML('beforeend','<div class="modalbg" onclick="this.remove()"><img class="preview" src="'+src+'"></div>')}function logout(){sessionStorage.removeItem('nyxtryp-admin-key');key='';showLogin()}if(key)load().catch(()=>{sessionStorage.removeItem('nyxtryp-admin-key');key='';showLogin()});else showLogin();
</script></body></html>
